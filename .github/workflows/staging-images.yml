name: Publish staging images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: staging-images
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: oidc-homologation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate public web build configuration
        env:
          OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
          OIDC_WEB_CLIENT_ID: ${{ vars.OIDC_WEB_CLIENT_ID }}
          OIDC_WEB_REDIRECT_URI: ${{ vars.OIDC_WEB_REDIRECT_URI }}
          OIDC_WEB_POST_LOGOUT_REDIRECT_URI: ${{ vars.OIDC_WEB_POST_LOGOUT_REDIRECT_URI }}
        run: |
          test -n "$OIDC_ISSUER"
          test -n "$OIDC_WEB_CLIENT_ID"
          test -n "$OIDC_WEB_REDIRECT_URI"
          test -n "$OIDC_WEB_POST_LOGOUT_REDIRECT_URI"

      - name: Build and publish API
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/zap-pronto-api:${{ github.sha }}
          sbom: true
          provenance: false
          cache-from: type=gha,scope=staging-api
          cache-to: type=gha,mode=max,scope=staging-api
      - name: Attest API provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/zap-pronto-api
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true
      - name: Scan API for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/zap-pronto-api@${{ steps.api.outputs.digest }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Build and publish web
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/zap-pronto-web:${{ github.sha }}
          sbom: true
          provenance: false
          build-args: |
            VITE_OIDC_AUTHORITY=${{ vars.OIDC_ISSUER }}
            VITE_OIDC_CLIENT_ID=${{ vars.OIDC_WEB_CLIENT_ID }}
            VITE_OIDC_REDIRECT_URI=${{ vars.OIDC_WEB_REDIRECT_URI }}
            VITE_OIDC_POST_LOGOUT_REDIRECT_URI=${{ vars.OIDC_WEB_POST_LOGOUT_REDIRECT_URI }}
          cache-from: type=gha,scope=staging-web
          cache-to: type=gha,mode=max,scope=staging-web
      - name: Attest web provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/zap-pronto-web
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true
      - name: Scan web for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/zap-pronto-web@${{ steps.web.outputs.digest }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Record immutable references
        run: |
          echo '### Immutable staging images' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo 'ZAP_API_IMAGE=ghcr.io/${{ github.repository_owner }}/zap-pronto-api@${{ steps.api.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'ZAP_WEB_IMAGE=ghcr.io/${{ github.repository_owner }}/zap-pronto-web@${{ steps.web.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
