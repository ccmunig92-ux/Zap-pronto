name: OIDC external homologation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Homologar ou somente recuperar a conta dedicada
        required: true
        default: homologate
        type: choice
        options:
          - homologate
          - recover-only

permissions:
  contents: read

concurrency:
  group: oidc-external-homologation
  cancel-in-progress: false

jobs:
  homologate:
    if: ${{ always() && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: oidc-homologation
    env:
      OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
      OIDC_AUDIENCE: ${{ vars.OIDC_AUDIENCE }}
      OIDC_JWKS_URL: ${{ vars.OIDC_JWKS_URL }}
      OIDC_DISCOVERY_URL: ${{ vars.OIDC_DISCOVERY_URL }}
      OIDC_ORGANIZATION_CLAIM: ${{ vars.OIDC_ORGANIZATION_CLAIM }}
      OIDC_EMAIL_CLAIM: ${{ vars.OIDC_EMAIL_CLAIM }}
      OIDC_EMAIL_VERIFIED_CLAIM: ${{ vars.OIDC_EMAIL_VERIFIED_CLAIM }}
      E2E_INBOX_FIXTURE_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate canonical contracts and harnesses
        if: ${{ inputs.mode == 'homologate' }}
        run: |
          pnpm typecheck:all
          pnpm test:all
      - name: Probe external OIDC discovery and signing keys
        if: ${{ inputs.mode == 'homologate' }}
        run: pnpm --filter @zap-pronto/api oidc:probe
      - name: Install isolated browser runtime
        run: pnpm --filter @zap-pronto/web exec playwright install --with-deps chromium
      - name: Exercise real administrator and attendant browser journeys
        if: ${{ inputs.mode == 'homologate' }}
        timeout-minutes: 15
        env:
          E2E_OIDC_ENABLED: "true"
          E2E_OIDC_TARGET: "external"
          E2E_REQUIRE_RENEWAL: "true"
          E2E_REQUIRE_BLOCK_REVOCATION: "true"
          E2E_EXTERNAL_ACCOUNT_BLOCK_ALLOWED: "true"
          E2E_BASE_URL: ${{ vars.OIDC_E2E_WEB_URL }}
          E2E_RENEW_WAIT_SECONDS: ${{ vars.E2E_RENEW_WAIT_SECONDS }}
          E2E_OIDC_TEST_TIMEOUT_MS: ${{ vars.E2E_OIDC_TEST_TIMEOUT_MS }}
          E2E_OIDC_USERNAME_SELECTOR: ${{ vars.E2E_OIDC_USERNAME_SELECTOR }}
          E2E_OIDC_PASSWORD_SELECTOR: ${{ vars.E2E_OIDC_PASSWORD_SELECTOR }}
          E2E_OIDC_SUBMIT_SELECTOR: ${{ vars.E2E_OIDC_SUBMIT_SELECTOR }}
          E2E_ADMIN_USERNAME: ${{ secrets.E2E_ADMIN_USERNAME }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_ADMIN_EXPECTED_TENANT: ${{ secrets.E2E_ADMIN_EXPECTED_TENANT }}
          E2E_ATTENDANT_USERNAME: ${{ secrets.E2E_ATTENDANT_USERNAME }}
          E2E_ATTENDANT_PASSWORD: ${{ secrets.E2E_ATTENDANT_PASSWORD }}
          E2E_ATTENDANT_EXPECTED_TENANT: ${{ secrets.E2E_ATTENDANT_EXPECTED_TENANT }}
          E2E_ATTENDANT_ADMIN_LIST_MATCH: ${{ secrets.E2E_ATTENDANT_ADMIN_LIST_MATCH }}
        run: >-
          pnpm --filter @zap-pronto/web test:e2e:oidc --grep
          "administrador autentica|atendente autentica|renovação mantém|bloqueio invalida"
      - name: Configure restricted staging fixture SSH
        if: ${{ inputs.mode == 'homologate' }}
        env:
          FIXTURE_HOST: ${{ vars.STAGING_FIXTURE_SSH_HOST }}
          FIXTURE_PORT: ${{ vars.STAGING_FIXTURE_SSH_PORT }}
          FIXTURE_USER: ${{ vars.STAGING_FIXTURE_SSH_USER }}
          FIXTURE_PRIVATE_KEY: ${{ secrets.STAGING_FIXTURE_SSH_PRIVATE_KEY }}
          FIXTURE_KNOWN_HOSTS: ${{ secrets.STAGING_FIXTURE_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          : "${FIXTURE_HOST:?STAGING_FIXTURE_SSH_HOST_REQUIRED}"
          : "${FIXTURE_USER:?STAGING_FIXTURE_SSH_USER_REQUIRED}"
          : "${FIXTURE_PRIVATE_KEY:?STAGING_FIXTURE_SSH_PRIVATE_KEY_REQUIRED}"
          : "${FIXTURE_KNOWN_HOSTS:?STAGING_FIXTURE_SSH_KNOWN_HOSTS_REQUIRED}"
          FIXTURE_PORT="${FIXTURE_PORT:-22}"
          case "$FIXTURE_HOST" in (*[!A-Za-z0-9.-]*|'') exit 64;; esac
          case "$FIXTURE_USER" in (*[!a-z0-9_-]*|'') exit 64;; esac
          case "$FIXTURE_USER" in ([a-z_]*) ;; (*) exit 64;; esac
          case "$FIXTURE_PORT" in (*[!0-9]*|'') exit 64;; esac
          test "$FIXTURE_PORT" -ge 1 && test "$FIXTURE_PORT" -le 65535
          install -d -m 0700 "$RUNNER_TEMP/staging-fixture-ssh"
          printf '%s\n' "$FIXTURE_PRIVATE_KEY" > "$RUNNER_TEMP/staging-fixture-ssh/id"
          printf '%s\n' "$FIXTURE_KNOWN_HOSTS" > "$RUNNER_TEMP/staging-fixture-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/staging-fixture-ssh/id" "$RUNNER_TEMP/staging-fixture-ssh/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/staging-fixture-ssh/id" >/dev/null
          if test "$FIXTURE_PORT" = 22; then lookup="$FIXTURE_HOST"; else lookup="[$FIXTURE_HOST]:$FIXTURE_PORT"; fi
          ssh-keygen -F "$lookup" -f "$RUNNER_TEMP/staging-fixture-ssh/known_hosts" >/dev/null
          printf 'FIXTURE_PORT=%s\n' "$FIXTURE_PORT" >> "$GITHUB_ENV"
      - name: Prepare isolated staging Inbox fixture
        if: ${{ inputs.mode == 'homologate' }}
        env:
          FIXTURE_HOST: ${{ vars.STAGING_FIXTURE_SSH_HOST }}
          FIXTURE_USER: ${{ vars.STAGING_FIXTURE_SSH_USER }}
        run: >-
          ssh -F /dev/null -i "$RUNNER_TEMP/staging-fixture-ssh/id"
          -p "$FIXTURE_PORT" -o BatchMode=yes -o PasswordAuthentication=no
          -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
          -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3
          -o "UserKnownHostsFile=$RUNNER_TEMP/staging-fixture-ssh/known_hosts"
          "$FIXTURE_USER@$FIXTURE_HOST" "prepare $E2E_INBOX_FIXTURE_KEY" >/dev/null
      - name: Exercise external Inbox claim reload and requeue
        if: ${{ inputs.mode == 'homologate' }}
        timeout-minutes: 5
        env:
          E2E_OIDC_ENABLED: "true"
          E2E_OIDC_TARGET: "external"
          E2E_FORBID_SKIPS: "true"
          E2E_BASE_URL: ${{ vars.OIDC_E2E_WEB_URL }}
          E2E_OIDC_TEST_TIMEOUT_MS: "180000"
          E2E_OIDC_USERNAME_SELECTOR: ${{ vars.E2E_OIDC_USERNAME_SELECTOR }}
          E2E_OIDC_PASSWORD_SELECTOR: ${{ vars.E2E_OIDC_PASSWORD_SELECTOR }}
          E2E_OIDC_SUBMIT_SELECTOR: ${{ vars.E2E_OIDC_SUBMIT_SELECTOR }}
          E2E_ATTENDANT_USERNAME: ${{ secrets.E2E_ATTENDANT_USERNAME }}
          E2E_ATTENDANT_PASSWORD: ${{ secrets.E2E_ATTENDANT_PASSWORD }}
          E2E_ATTENDANT_EXPECTED_TENANT: ${{ secrets.E2E_ATTENDANT_EXPECTED_TENANT }}
        run: >-
          pnpm --filter @zap-pronto/web test:e2e:oidc --grep
          "inbound materializado permite claim e devolução segura à fila"
      - name: Verify isolated staging Inbox fixture
        if: ${{ always() && inputs.mode == 'homologate' }}
        env:
          FIXTURE_HOST: ${{ vars.STAGING_FIXTURE_SSH_HOST }}
          FIXTURE_USER: ${{ vars.STAGING_FIXTURE_SSH_USER }}
        run: >-
          ssh -F /dev/null -i "$RUNNER_TEMP/staging-fixture-ssh/id"
          -p "$FIXTURE_PORT" -o BatchMode=yes -o PasswordAuthentication=no
          -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
          -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3
          -o "UserKnownHostsFile=$RUNNER_TEMP/staging-fixture-ssh/known_hosts"
          "$FIXTURE_USER@$FIXTURE_HOST" "verify $E2E_INBOX_FIXTURE_KEY" >/dev/null
      - name: Cleanup isolated staging Inbox fixture
        if: ${{ always() && inputs.mode == 'homologate' }}
        env:
          FIXTURE_HOST: ${{ vars.STAGING_FIXTURE_SSH_HOST }}
          FIXTURE_USER: ${{ vars.STAGING_FIXTURE_SSH_USER }}
        run: >-
          ssh -F /dev/null -i "$RUNNER_TEMP/staging-fixture-ssh/id"
          -p "$FIXTURE_PORT" -o BatchMode=yes -o PasswordAuthentication=no
          -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
          -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3
          -o "UserKnownHostsFile=$RUNNER_TEMP/staging-fixture-ssh/known_hosts"
          "$FIXTURE_USER@$FIXTURE_HOST" "cleanup $E2E_INBOX_FIXTURE_KEY" >/dev/null
      - name: Recover dedicated attendant account
        if: ${{ always() }}
        timeout-minutes: 3
        env:
          E2E_OIDC_ENABLED: "true"
          E2E_OIDC_TARGET: "external"
          E2E_REQUIRE_BLOCK_REVOCATION: "true"
          E2E_EXTERNAL_ACCOUNT_BLOCK_ALLOWED: "true"
          E2E_BASE_URL: ${{ vars.OIDC_E2E_WEB_URL }}
          E2E_OIDC_TEST_TIMEOUT_MS: "120000"
          E2E_OIDC_USERNAME_SELECTOR: ${{ vars.E2E_OIDC_USERNAME_SELECTOR }}
          E2E_OIDC_PASSWORD_SELECTOR: ${{ vars.E2E_OIDC_PASSWORD_SELECTOR }}
          E2E_OIDC_SUBMIT_SELECTOR: ${{ vars.E2E_OIDC_SUBMIT_SELECTOR }}
          E2E_ADMIN_USERNAME: ${{ secrets.E2E_ADMIN_USERNAME }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_ADMIN_EXPECTED_TENANT: ${{ secrets.E2E_ADMIN_EXPECTED_TENANT }}
          E2E_ATTENDANT_ADMIN_LIST_MATCH: ${{ secrets.E2E_ATTENDANT_ADMIN_LIST_MATCH }}
        run: >-
          pnpm --filter @zap-pronto/web test:e2e:oidc --grep
          "recuperação idempotente"
