name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:all
      - run: pnpm test:all
      - run: pnpm build:all
      - run: node --test scripts/db-provision-runtime.test.mjs
      - name: Validate integrated staging manifest
        run: docker compose --env-file deploy/staging/.env.example -f deploy/staging/compose.yaml config --quiet
      - name: Build API staging image
        run: docker build --file Dockerfile.api --tag zap-pronto-api:ci .
      - name: Build web staging image
        run: >-
          docker build --file Dockerfile.web --tag zap-pronto-web:ci
          --build-arg VITE_OIDC_AUTHORITY=https://identity.example.com
          --build-arg VITE_OIDC_CLIENT_ID=ci-public-client
          --build-arg VITE_OIDC_REDIRECT_URI=https://staging.example.com/auth/callback
          --build-arg VITE_OIDC_POST_LOGOUT_REDIRECT_URI=https://staging.example.com/
          .
      - run: pnpm db:test
        env:
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      - run: pnpm db:test:upgrade
        env:
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
