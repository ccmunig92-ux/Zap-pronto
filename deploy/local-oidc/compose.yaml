services:
  local-seed:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zap_pronto}
      POSTGRES_USER: ${POSTGRES_USER:-zap_pronto_owner}
      LOCAL_OIDC_ISSUER: ${LOCAL_OIDC_ORIGIN:?LOCAL_OIDC_ORIGIN is required}/realms/zap-pronto-local
    command: ["/bin/sh", "-ec", "export PGPASSWORD=\"$$(cat /run/secrets/postgres_password)\"; psql --host postgres --username \"$$POSTGRES_USER\" --dbname \"$$POSTGRES_DB\" --set ON_ERROR_STOP=1 --set oidc_issuer=\"$$LOCAL_OIDC_ISSUER\" --file /local-seed/seed.sql"]
    secrets: [postgres_password]
    volumes: ["./seed.sql:/local-seed/seed.sql:ro"]
    networks: [data]
    depends_on:
      migrate: { condition: service_completed_successfully }

  keycloak:
    image: quay.io/keycloak/keycloak@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-enabled=true", "--hostname=${LOCAL_OIDC_ORIGIN}", "--proxy-headers=xforwarded", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${LOCAL_KEYCLOAK_ADMIN_USERNAME:?required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${LOCAL_KEYCLOAK_ADMIN_PASSWORD:?required}
      LOCAL_OIDC_ORIGIN: ${LOCAL_OIDC_ORIGIN:?required}
      LOCAL_OIDC_ADMIN_PASSWORD: ${LOCAL_OIDC_ADMIN_PASSWORD:?required}
      LOCAL_OIDC_ATTENDANT_PASSWORD: ${LOCAL_OIDC_ATTENDANT_PASSWORD:?required}
      JAVA_OPTS_KC_HEAP: -XX:MaxHeapFreeRatio=30 -XX:MaxRAMPercentage=65
    volumes:
      - ./zap-pronto-local-realm.json:/opt/keycloak/data/import/zap-pronto-local-realm.json:ro
      - keycloak_data:/opt/keycloak/data
    networks:
      app:
        aliases: ["${LOCAL_OIDC_HOST:?required}"]
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q 'HTTP/1.1 200' <&3
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { cpus: "1.50", memory: 1024M }

  api:
    environment:
      NODE_EXTRA_CA_CERTS: /run/secrets/local_tls_ca
      OIDC_ISSUER: ${LOCAL_OIDC_ORIGIN}/realms/zap-pronto-local
      OIDC_AUDIENCE: zap-pronto-local
      OIDC_JWKS_URL: ${LOCAL_OIDC_ORIGIN}/realms/zap-pronto-local/protocol/openid-connect/certs
      OIDC_DISCOVERY_URL: ${LOCAL_OIDC_ORIGIN}/realms/zap-pronto-local/.well-known/openid-configuration
      OIDC_ORGANIZATION_CLAIM: org_id
    secrets: [local_tls_ca]
    depends_on:
      local-seed: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }

  web:
    ports: !reset []
    environment:
      OIDC_AUTHORITY_ORIGIN: ${LOCAL_OIDC_ORIGIN}

  local-edge:
    image: nginxinc/nginx-unprivileged:1.28.0-alpine3.21@sha256:c97ff0bf7cbae369953c6da1232ec14ad9f971d66360c5698db0856a4cd657a0
    restart: unless-stopped
    environment:
      LOCAL_OIDC_HOST: ${LOCAL_OIDC_HOST:?required}
      NGINX_ENVSUBST_FILTER: "^(LOCAL_OIDC_HOST)$"
    ports: ["127.0.0.1:${LOCAL_HTTPS_PORT:-18443}:8443"]
    secrets: [local_tls_cert, local_tls_key]
    volumes: ["./edge.conf.template:/etc/nginx/templates/default.conf.template:ro"]
    networks: [app]
    depends_on:
      web: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "--spider", "https://127.0.0.1:8443/health/web"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=32m,mode=0755,uid=101,gid=101
      - /etc/nginx/conf.d:size=8m,mode=0755,uid=101,gid=101
      - /var/run:size=8m,mode=0755,uid=101,gid=101
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  keycloak_data:

secrets:
  local_tls_ca:
    file: ${LOCAL_TLS_CA_FILE:?must be outside repository}
  local_tls_cert:
    file: ${LOCAL_TLS_CERT_FILE:?must be outside repository}
  local_tls_key:
    file: ${LOCAL_TLS_KEY_FILE:?must be outside repository}
